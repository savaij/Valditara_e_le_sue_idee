ated":0},{"code":"PVMM821028","name":"FERMI - SANTA GIULETTA","comune":"SANTA GIULETTA","provincia":"PAVIA","value":2,"lat":45.033775399999996,"lon":9.1850834,"unallocated":0},{"code":"RCEE82907R","name":"DON TEODORO RIGITANO CAMINI","comune":"CAMINI","provincia":"REGGIO CALABRIA","value":2,"lat":38.4311039,"lon":16.4835463,"unallocated":0},{"code":"RGPL025009","name":"LICEO LINGUISTICO PARITARIO LANZA","comune":"VITTORIA","provincia":"RAGUSA","value":3,"lat":36.8923953,"lon":14.4295132,"unallocated":3},{"code":"RGTD03002X","name":"SEZ.STACCATA ITC BESTA RAGUSA","comune":"SANTA CROCE CAMERINA","provincia":"RAGUSA","value":5,"lat":36.830949,"lon":14.5263631,"unallocated":5},{"code":"SAEE83902R","name":"ANGELO PATRI - AVERSANA","comune":"BATTIPAGLIA","provincia":"SALERNO","value":1,"lat":40.5539024,"lon":14.9244676,"unallocated":0},{"code":"SAEE87201B","name":"POLLA CAP.P.P.","comune":"POLLA","provincia":"SALERNO","value":6,"lat":40.5117608,"lon":15.4941015,"unallocated":1},{"code":"SAEE87202C","name":"S. PIETRO","comune":"POLLA","provincia":"SALERNO","value":6,"lat":40.518891,"lon":15.503924,"unallocated":6},{"code":"SAEE87204E","name":"CAGGIANO CAP","comune":"CAGGIANO","provincia":"SALERNO","value":6,"lat":40.5669251,"lon":15.4954959,"unallocated":0},{"code":"SAEE87206L","name":"AULETTA CAP.","comune":"AULETTA","provincia":"SALERNO","value":4,"lat":40.5567262,"lon":15.4250948,"unallocated":4},{"code":"SAEE8AP053","name":"PISCIOTTA CAP.P.P.","comune":"PISCIOTTA","provincia":"SALERNO","value":1,"lat":40.1089413,"lon":15.233729199999999,"unallocated":1},{"code":"SAMM87201A","name":"POLLA \"E.DE AMICIS\"","comune":"POLLA","provincia":"SALERNO","value":24,"lat":40.5233583,"lon":15.4955217,"unallocated":24},{"code":"SAMM87202B","name":"CAGGIANO","comune":"CAGGIANO","provincia":"SALERNO","value":8,"lat":40.5669251,"lon":15.4954959,"unallocated":1},{"code":"SAMM87203C","name":"AULETTA","comune":"AULETTA","provincia":"SALERNO","value":6,"lat":40.5567262,"lon":15.4250948,"unallocated":6},{"code":"SARA01010L","name":"IPSASR SARNO","comune":"SARNO","provincia":"SALERNO","value":1,"lat":40.8248409,"lon":14.6079218,"unallocated":0},{"code":"SREE85103E","name":"I.C. \"F. D'AMICO\" ROSOLINI","comune":"ROSOLINI","provincia":"SIRACUSA","value":2,"lat":36.822139400000005,"lon":14.9525316,"unallocated":0}], title="Studenti da riallocare nelle prime", note="Studenti stimati da riallocare nelle prime classi. Le destinazioni sono cercate entro 5 km tra plessi.";
const total=150, unallocatedTotal=72, firstYears=true;
const map=L.map('map').setView([42.5,12.5],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function markerFor(p,count,label){
 const icon=L.divIcon({className:'',html:'<span class="student-marker">'+count+'</span>',iconSize:[38,38],iconAnchor:[19,19],popupAnchor:[0,-19]});
 const marker=L.marker([p.lat,p.lon],{icon,studentCount:count});
 marker.bindPopup('<strong>'+esc(p.name)+'</strong><br>'+esc(p.comune)+' ('+esc(p.provincia)+')<br>'+label+': <strong>'+count+'</strong><br>Codice: '+esc(p.code));
 marker.bindTooltip(count+' '+(count===1?'studente':'studenti'));
 return marker;
}
function clusterDiameter(count){return count<10?40:count<50?46:52;}
function clusterIcon(cluster){
 const count=cluster.getAllChildMarkers().reduce((sum,marker)=>sum+marker.options.studentCount,0);
 const diameter=clusterDiameter(count), radius=diameter/2;
 return L.divIcon({className:'',html:'<span class="cluster-marker" style="width:'+diameter+'px;height:'+diameter+'px;font-size:14px">'+count+'</span>',iconSize:[diameter,diameter],iconAnchor:[radius,radius]});
}
function clusterLayer(){return L.markerClusterGroup({iconCreateFunction:clusterIcon,maxClusterRadius:75,showCoverageOnHover:false,spiderfyOnMaxZoom:true,disableClusteringAtZoom:13});}
const allLayer=clusterLayer().addTo(map);
const unallocatedLayer=clusterLayer();
for(const p of points){
 const label=firstYears?'Da riallocare':'Studenti nei gruppi sopra soglia';
 markerFor(p,p.value,label).addTo(allLayer);
 if(firstYears && p.unallocated>0){
   markerFor(p,p.unallocated,'Non riallocabili entro 5 km').addTo(unallocatedLayer);
 }
}
if(firstYears){
 L.control.layers(null,{['Solo non riallocabili entro 5 km ('+unallocatedTotal+')']:unallocatedLayer},{collapsed:false}).addTo(map);
 map.on('overlayadd',event=>{if(event.layer===unallocatedLayer)map.removeLayer(allLayer);});
 map.on('overlayremove',event=>{if(event.layer===unallocatedLayer)map.addLayer(allLayer);});
}
map.fitBounds(L.latLngBounds(points.map(p=>[p.lat,p.lon])),{padding:[30,30],maxZoom:9});
const panel=L.control({position:'topleft'});
panel.onAdd=()=>{const el=L.DomUtil.create('div','panel');el.innerHTML='<h1>'+esc(title)+'</h1><p>'+esc(note)+'</p><p><span class="legend-dot"></span> '+total.toLocaleString('it-IT')+' studenti stimati. Allontanandosi, i cerchi vicini si uniscono: il numero è la somma. I cerchi più grandi restano compatti.</p>';L.DomEvent.disableClickPropagation(el);return el;};
panel.addTo(map);
</script></body></html>
